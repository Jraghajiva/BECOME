<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BECOME | A–G Interactive Data Atlas</title>
<style>
:root{color-scheme:dark;--bg:#10141c;--panel:#1a2130;--edge:#344050;--fg:#edf5fb;--sub:#a9bacc;--accent:#52d8ce;--focus:#facd80}*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);margin:0;font:15px/1.55 system-ui,"Noto Sans",sans-serif}
main{max-width:1240px;margin:auto;padding:26px 24px 70px}
a{color:var(--accent)} header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--edge)}
h1{font-size:clamp(25px,4.8vw,46px);margin:4px 0 6px;line-height:1.2}h2{font-size:18px;margin:0 0 12px}p{color:var(--sub);margin:6px 0}
.tag{font:12px monospace;color:var(--accent);letter-spacing:.12em}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{border:1px solid var(--edge);background:#252d3d;color:var(--fg);font:inherit;border-radius:9px;padding:9px 13px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--accent);background:#21443f;color:#d8fff7}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.panel{border:1px solid var(--edge);background:var(--panel);border-radius:14px;padding:18px;margin-top:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
#groupTabs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:17px}
#groupTabs button{text-align:left;min-height:66px;display:flex;flex-direction:column;gap:4px}
#groupTabs strong{font-size:20px}
#groupTabs small{color:var(--sub);font-size:11px}
.timeRow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)}
#dayOut{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
#fig{width:100%;height:auto;display:block;min-height:210px;touch-action:pan-y}
.chartbox{overflow:hidden}
#facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.fact{border:1px solid var(--edge);border-radius:10px;padding:12px;background:#151d2a;min-width:0}
.fact small{color:var(--sub);display:block;min-height:34px}.fact strong{font-size:clamp(15px,2.5vw,24px);overflow-wrap:anywhere}
#records{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.record{background:#141c29;border:1px solid var(--edge);border-radius:9px;padding:9px 12px;text-align:left;min-width:0}
.record small{display:block;color:var(--sub)}.record strong{font-size:17px;font-variant-numeric:tabular-nums}
.record[aria-pressed=true]{border-color:var(--accent)}
#modeButtons{display:flex;gap:8px;flex-wrap:wrap}
#source{font-size:12px;color:var(--sub)}
#tooltip{min-height:24px;color:var(--accent);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--sub);font-size:12px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.svgtext{fill:#b6c4d0;font:13px system-ui,sans-serif}.tick{fill:#a6b8c9;font:12px system-ui,sans-serif}
footer{border-top:1px solid var(--edge);margin-top:26px;padding-top:16px;color:var(--sub);font-size:12px}
@media(max-width:880px){#groupTabs{grid-template-columns:repeat(4,1fr)}#facts{grid-template-columns:repeat(2,1fr)}#records{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){main{padding:16px}#groupTabs{grid-template-columns:repeat(2,1fr)}#records{grid-template-columns:1fr}.timeRow{grid-template-columns:1fr auto}.timeRow label{grid-column:1/-1}}
</style>
</head>

function renderFacts(){const p=e("facts");p.replaceChildren();const t=TX[lang],x=nodes(group),max=Math.max(...x.map(v=>v[1])),min=Math.min(...x.map(v=>v[1]));const near=x.reduce((a,b)=>Math.abs(b[0]-day)<Math.abs(a[0]-day)?b:a,x[0]);const special=group==="C";p.append(fact(t.range,h(special?0:near[0])),fact(t.value,special?num(near[1]):num(near[1])+" "+(D[group].metrics[mode].unit||"")),fact(t.nearest,special?t.records.C[0]:h(near[0])),fact(special?t.audit:t.modes[D[group].modes[mode]],special?num(x[0][1]):num(min)+" — "+num(max)))}
function svg(tag,attrs,textContent){const n=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const [k,v] of Object.entries(attrs||{}))n.setAttribute(k,String(v));if(textContent!==undefined)n.textContent=textContent;return n}
function plot(){const root=e("fig");root.replaceChildren();const t=TX[lang],data=nodes(group),color=D[group].color;const xmin=70,xmax=954,ymin=38,ymax=312;const px=d=>xmin+d/1095*(xmax-xmin);const axis=()=>{for(let j=0;j<4;j++){let y=ymin+j*(ymax-ymin)/3;root.append(svg("path",{d:"M"+xmin+" "+y+"H"+xmax,stroke:"#344052","stroke-width":1}));}for(const d of [0,180,365,730,900,1095])root.append(svg("text",{x:px(d),y:346,"text-anchor":"middle",class:"tick"},"H"+d));root.append(svg("line",{x1:px(day),y1:ymin,x2:px(day),y2:ymax,stroke:"#e9bf72","stroke-dasharray":"5 5","stroke-width":1.5}))};
const label=(x,y,text,anchor="start")=>root.append(svg("text",{x,y,fill:"#dfeaf6","font-size":13,"text-anchor":anchor},text));
axis();
if(D[group].type==="line"){const vals=data.map(p=>p[1]),low=Math.min(0,...vals),hi=Math.max(...vals)*1.14||1;const py=v=>ymax-(v-low)/(hi-low)*(ymax-ymin);for(let j=0;j<=4;j++){let v=low+(hi-low)*j/4;root.append(svg("text",{x:60,y:py(v)+4,class:"tick","text-anchor":"end"},num(v)))}root.append(svg("polyline",{points:data.map(p=>px(p[0])+","+py(p[1])).join(" "),fill:"none",stroke:color,"stroke-width":3}));data.forEach((p,i)=>{const c=svg("circle",{cx:px(p[0]),cy:py(p[1]),r:Math.abs(day-p[0])<2?8:6,fill:color,stroke:"#15202c","stroke-width":2,tabindex:0,role:"button","aria-label":h(p[0])+" "+num(p[1])});c.append(svg("title",{},h(p[0])+" · "+num(p[1])+" "+D[group].metrics[mode].unit));c.addEventListener("click",()=>setDay(p[0]));c.addEventListener("mouseenter",()=>{txt("tooltip",h(p[0])+" · "+num(p[1])+" "+D[group].metrics[mode].unit)});c.addEventListener("keydown",ev=>{if(ev.key==="Enter")setDay(p[0])});root.append(c)})}
else if(D[group].type==="bar"){const labels=t.records.C;const maxlog=Math.log1p(data[0][1]);data.forEach((p,i)=>{const y=57+i*71,len=Math.max(0,Math.log1p(p[1])/maxlog*625);label(75,y-12,labels[i]);const bar=svg("rect",{x:75,y,width:len,height:20,rx:5,fill:color});bar.append(svg("title",{},labels[i]+": "+num(p[1])));root.append(bar);label(85+len,y+16,num(p[1]))})}
else if(D[group].type==="milestone"){data.forEach((p,i)=>{const y=63+i*(group==="E"?48:90);root.append(svg("line",{x1:xmin,y1:y,x2:xmax,y2:y,stroke:"#344052","stroke-width":2}));const c=svg("circle",{cx:px(p[0]),cy:y,r:9,fill:color,tabindex:0,role:"button"});c.append(svg("title",{},h(p[0])+" · "+t.records[group][i]));c.addEventListener("click",()=>setDay(p[0]));c.addEventListener("keydown",ev=>{if(ev.key==="Enter")setDay(p[0])});root.append(c);const x=Math.min(px(p[0])+14,680);label(x,y+5,h(p[0])+" · "+t.records[group][i])})}
else if(D[group].type==="interval"){root.append(svg("rect",{x:px(608),y:110,width:Math.max(12,px(610)-px(608)),height:95,fill:color,opacity:.8}));root.append(svg("circle",{cx:px(609),cy:150,r:9,fill:color}));label(Math.max(90,px(608)-180),95,h(608)+"–"+h(610));label(Math.max(90,px(608)-180),230,"12×");}
if(D[group].type==="bar")txt("tooltip",t.audit);else{const exact=data.find(p=>p[0]===day);txt("tooltip",exact?h(day)+" · "+num(exact[1])+" "+D[group].metrics[mode].unit:t.noData)}
}
function renderChart(){renderFacts();plot()}
function renderRecords(){const t=TX[lang],x=nodes(group),parent=e("records");parent.replaceChildren();x.forEach((p,i)=>{const b=document.createElement("button");b.className="record";b.setAttribute("aria-pressed",String(day===p[0]));const sm=document.createElement("small");sm.textContent=t.records[group]?t.records[group][i]:h(p[0]);const st=document.createElement("strong");st.textContent=group==="C"?num(p[1]):h(p[0])+" · "+num(p[1])+(group==="G"?"×":group==="D"?(i===0?"%":"°C"):" "+D[group].metrics[mode].unit);b.append(sm,st);b.onclick=()=>setDay(group==="C"?day:p[0]);parent.append(b)});txt("recordCount",x.length+" "+t.count)}
function render(){const t=TX[lang],m=D[group].modes[mode];["heading","subtitle","back","domains","timeTitle","dayLabel","timeNote","samplesHeading","evidenceHeading"].forEach(k=>txt(k,t[k]));txt("previous",t.prev);txt("next",t.next);txt("viewHeading",group+" / "+t.groups[group]);txt("summary",t.note[group]);txt("source",t.sources[group]);txt("boundary",t.bounds[group]);txt("footerText",t.footer);renderTabs();const buttons=e("modeButtons");buttons.replaceChildren();D[group].modes.forEach((name,i)=>{const b=document.createElement("button");b.textContent=t.modes[name];b.setAttribute("aria-pressed",String(i===mode));b.onclick=()=>setMode(i);buttons.append(b)});renderTime();renderChart();renderRecords();e("legend").replaceChildren()}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang==="zh"?"zh-Hans":lang;document.querySelectorAll("[data-lang]").forEach(n=>n.setAttribute("aria-pressed",String(n.dataset.lang===lang)));render()});
e("day").oninput=()=>setDay(Number(e("day").value));e("previous").onclick=()=>move(-1);e("next").onclick=()=>move(1);render();
</script></body></html>
